The [item]Large Chemical Reactor[/] chlorinates [item]Rutile[/], or the Moon's [item]Ilmenite[/], into [item]Titanium Tetrachloride[/]; the Chemical Reactor then reduces it with [item]Magnesium[/] under argon (circuit 3). Electrolyze the [item]Magnesium Chloride[/] to close the loop.
"""

[[quest]]
key = "siemens"
title = "Siemens Process"
role = "hint"
icon = "gtia:trichlorosilane_bucket"
x = 8.5
y = 1.5
size = 1.25
deps = ["hv_pump", "hv_cr", "hv_power"]
subtitle = "Silicon, nine nines."
text = """
In the [item]Chemical Reactor[/], silicon and hydrochloric acid become [item]Trichlorosilane[/] (circuit 1); on hot rods it deposits [item]Polysilicon[/] and gives the acid back (circuit 2).
"""

[[quest]]
key = "polysilicon"
title = "Polysilicon"
role = "side"
icon = "gtia:polysilicon_dust"
x = 10.5
y = 1.5
shape = "circle"
deps = ["siemens"]
subtitle = "Half the silicon per boule."
task = [{ item = "gtia:polysilicon_dust" }]
text = """
Sixteen of it grow a [item]Silicon Boule[/] in the Electric Blast Furnace on circuit 3, instead of thirty-two silicon dust.
"""

# ------------------------------------------------------------------ tips (D-291)

[[quest]]
key = "tip_cleanroom"
title = "Working in a Cleanroom"
role = "hint"
icon = "gtceu:cleanroom"
deps = ["cleanroom"]
subtitle = "Some recipes need clean air."
text = """
Recipes marked [item]Cleanroom[/] in EMI only run in a machine that stands inside a formed Cleanroom: plascrete walls, filter casings on the ceiling, a door. Bring power and items through the walls with hatches or Diodes.

The Cleanroom needs power to stay clean; if it loses it, the recipes inside stop.
"""

[[quest]]
key = "tip_distillation"
title = "Distillation and Cracking"
role = "hint"
icon = "gtceu:distillation_tower"
deps = ["distillation"]
subtitle = "One product per layer."
text = """
The Distillation Tower puts one product on each layer, so every layer needs its own Output Hatch. Cracking a fraction first, with Hydrogen or Steam, changes what it splits into.
"""

[[quest]]
key = "tip_catalyst"
title = "Catalyst Wear"
role = "hint"
icon = "gtia:alumina_dust"
deps = ["claus"]
subtitle = "Normal worlds only."
text = """
In [item]Normal[/] worlds the catalyst of a GTIA chemistry plant has a [num]1%[/] chance to wear out on every run, so keep a supply line for it. In [item]Journey[/] worlds catalysts last forever.
"""

[[quest]]
key = "tip_organs"
title = "Organs Before the Moon"
role = "hint"
icon = "gtia:organ_modifier"
deps = ["organ_modifier"]
subtitle = "Space hurts."
text = """
In [item]Normal[/] worlds the Moon and Mars hurt a body whose organ set is below tier [num]1[/]. Fill every organ slot with tier 1 organs before you launch.
"""
