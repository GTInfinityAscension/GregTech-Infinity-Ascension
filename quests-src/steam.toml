icon = "gtceu:fireclay_dust"
title = "Fireclay"
subtitle = "Brick dust and clay dust."
task = [{ item = "gtceu:fireclay_dust", count = 4 }]
text = """
Grind [item]Bricks[/] and [item]Clay[/] into dust, with the mortar or the Macerator, and mix one of each into [num]two[/] [item]Fireclay Dust[/].
"""

[[quest]]
key = "firebricks"
x = 16
y = 0
role = "spine"
deps = ["fireclay"]
icon = "gtceu:firebricks"
title = "Firebricks"
subtitle = "Compress, bake, stack."
task = [{ item = "gtceu:compressed_fireclay" }, { item = "gtceu:firebricks", count = 4 }]
text = """
Compress [item]Fireclay Dust[/], bake it in a furnace into a [item]Firebrick[/], and set [num]four[/] Firebricks into one [item]Firebricks[/] block.

[tip]Open the blast furnace's multiblock preview for the exact count before you start baking.[/]
"""

[[quest]]
key = "pbf"
x = 18
y = 0
role = "spine"
deps = ["firebricks"]
icon = "gtceu:primitive_blast_furnace"
title = "Primitive Blast Furnace"
subtitle = "Your first furnace for Steel."
task = [{ item = "gtceu:primitive_blast_furnace" }]
reward = [{ item = "minecraft:coal_block", count = 8 }]
text = """
Build the furnace around its controller. It turns [item]Iron[/] and fuel into [item]Steel[/] without any steam at all, slowly.

[tip]Wrought Iron is much faster than plain Iron:[/] with Coke, a Steel ingot takes [num]600 ticks[/] from Wrought Iron and [num]1500[/] from Iron.
"""

[[quest]]
key = "steel_age"
x = 20.5
y = 0
task = [{ item = "gtceu:steel_ingot" }]
role = "milestone"
deps = ["bronze_age", "pbf"]
title = "Steel"
subtitle = "The metal of the rest of the game."
reward = [{ title = "More fuel or more iron", choice = [{ item = "gtceu:coke_block", count = 8 }, { item = "minecraft:coal_block", count = 16 }, { item = "gtceu:wrought_iron_ingot", count = 16 }] }]
text = """
Your first [item]Steel[/] ingot. From here on Steel is in nearly everything: molds, bolts, high-pressure machines, GTNA's large steam machines and the first circuit.
"""

[[quest]]
key = "high_pressure"
x = 20.5
y = -2.5
role = "optional"
deps = ["steel_age"]
icon = "gtceu:hp_steam_solid_boiler"
title = "High Pressure"
subtitle = "Steel boilers, faster machines."
task = [{ item = "gtceu:hp_steam_solid_boiler" }]
text = """
With [item]Steel[/] you can build the high-pressure boiler and high-pressure versions of every steam machine. They finish recipes in [num]half the time[/] and burn more steam doing it.
"""

