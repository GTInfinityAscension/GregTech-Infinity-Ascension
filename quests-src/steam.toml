# ------------------------------------------------------------------ chemistry slice 01: wood chemistry and lime (GTIA-D-229)

[[quest]]
key = "wood_retort"
x = 14
y = 2
deps = ["firebricks"]
group = "wood"
role = "side"
title = "Wood Retort"
subtitle = "Cook wood without air."
task = [{ item = "gtia:wood_retort" }]
text = """
A furnace burns wood. A [item]Wood Retort[/] cooks it in a sealed box, and the wood comes apart: [num]4 logs[/] give [num]3 Charcoal[/] and [num]1,000 mB[/] of [item]Charcoal Byproducts[/] every [num]30 s[/], with no fuel at all.

Build it like a Coke Oven, but taller: a hollow [num]3×3×4[/] of [item]Firebricks[/] with the controller in the middle of a face. Coke Oven Hatches in the walls automate it.

[tip]Real fact:[/] until the 1920s, almost all of the world's methanol came from cooking wood. That is why it was called wood alcohol.
"""

[[quest]]
key = "charcoal_byproducts"
x = 14
y = 4
deps = ["wood_retort"]
group = "wood"
role = "detail"
title = "Charcoal Byproducts"
subtitle = "Smells like a campfire with a chemistry degree."
task = [{ item = "gtceu:charcoal_byproducts_bucket" }]
text = """
The liquid in the Retort's tank is a mix of wood vinegar and tar. You cannot separate it yet: keep it in tanks. In Low Voltage, a [item]Still[/] turns it into acid, alcohol and creosote.

[num]Three Retorts[/] fill exactly one Still.
"""

[[quest]]
key = "lime_kiln"
deps = ["pbf", "macerator"]
x = 18
y = -2
group = "lime"
role = "side"
title = "Lime Kiln"
subtitle = "Rocks in, hotter rocks out."
task = [{ item = "gtia:lime_kiln" }]
text = """
Calcite is limestone. Burn it and it becomes [item]Quicklime[/]: [num]4 Calcite Dust[/] and one Charcoal, Coal or Coke give [num]4 Quicklime[/] in [num]20 s[/]; the CO₂ goes up the shaft.

Calcite blocks line dripstone caves and amethyst geodes; the Steam Macerator turns them into dust. Build a hollow [num]3×3×5[/] shaft of [item]Firebricks[/], open at the top, controller low on a face.

[tip]Real fact:[/] lime kilns are older than writing.
"""

[[quest]]
key = "fluxed_steel"
x = 18
y = -4
deps = ["lime_kiln"]
group = "lime"
role = "side"
title = "Fluxed Steel"
subtitle = "Faster steel, same furnace."
task = [{ item = "gtceu:quicklime_dust", count = 4 }]
text = """
Add Quicklime to the Primitive Blast Furnace: [num]2 Wrought Iron[/], [num]2 Charcoal[/] (or Coal) and [num]1 Quicklime[/] give [num]2 Steel[/] in [num]50 s[/]. That is [num]2.4 Steel[/] a minute per furnace, against [num]1.5[/] without it.

One Lime Kiln keeps about ten furnaces fluxed.

[tip]Real fact:[/] real blast furnaces add limestone as flux. It grabs the sulfur and the sand and floats them off as slag.
"""

