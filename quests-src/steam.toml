x = 5.5
y = 13
role = "detail"
icon = "gtceu:wrought_iron_plate"
title = "Wrought Iron Plates"
subtitle = "The first job for the hammer."
task = [{ item = "gtceu:wrought_iron_plate", count = 8 }]
text = """
[num]Eight[/] [item]Wrought Iron Plates[/] make an [item]Ultra Low Voltage Machine Casing[/], later in this chapter.
"""

# ------------------------------------------------------------------ Fireclay, the blast furnace and Steel

[[quest]]
key = "fireclay"
