# Steam Age, one item per quest. Every branch starts at the item it is made from (the Piston leads to the
# Compressor and the Macerator, the Compressor to Iron Blocks and the blast-furnace bricks), so the tree reads as
# "what you just made opens this". A road runs left to right through the stops (boiler, Piston, Compressor,
# Fireclay, blast furnace, Steel, molds, glass, the first circuit); side branches go up and down from it. GTNA's
# Large steam machines (and the Leap Forward furnace, the Primitive Stone Furnace and the Cactus Wonder) sit side by
# side in a gallery at the top, GTO style; their parts (Precision Steam Component, Brick Kiln -> Clay Compound ->
# Hydraulic Piston, Breel) stay in the tree. Not in this chapter, by the author's call:
# the Ancient World, GTNA's vaults and the Cactus Wonder. Facts come from the pack's recipes or GTIACore's docs.
# Colours: [item] [num] [warn] [tip] [mech] [note] (see questgen.COLOURS).

[chapter]
title = "Steam Age"
icon = "gtceu:lp_steam_solid_boiler"

[entry]
x = 0
y = 0
subtitle = "Ascension I"
requires = ["start/Ready for Steam"]
text = """
[item]Bronze[/] and [item]Coke[/] got you here. Now water becomes steam, and steam drives your first machines.

Each quest asks for one thing, and each branch starts from what it is made of. The road runs left to right to [item]Steel[/] and the first circuit. Gears are the stops that matter; diamonds are optional.
"""

[[quest]]
key = "bronze_age"
x = 2
y = 0
title = "Bronze Age"
role = "spine"
task = [{ item = "gtceu:bronze_ingot" }]
deps = ["entry"]
subtitle = "Where the Steam age begins."
text = """
You already carry [item]Bronze[/] from Start, so this completes as soon as you open the chapter. Everything in this tier grows from it.
"""

[[quest]]
key = "steam_rules"
x = 0
y = -2.5
role = "hint"
deps = ["entry"]
icon = "gtceu:steam_machine_casing"
title = "How Steam Machines Work"
subtitle = "Three rules worth knowing first."
checkmark = "Understood"
text = """
- Every steam machine has an [mech]exhaust[/]. [warn]Keep the block in front of it empty[/], or the machine stops after one operation.
- Low-pressure machines take [num]twice as long[/] as high-pressure ones. High pressure needs [item]Steel[/].
- A steam machine refuses any recipe above [num]32 EU/t[/] (Low Voltage). Those recipes wait for electricity.
"""

# ------------------------------------------------------------------ the boiler

[[quest]]
key = "boiler"
x = 4
y = 0
role = "spine"
deps = ["bronze_age"]
icon = "gtceu:lp_steam_solid_boiler"
title = "Boil Water"
subtitle = "Five plates around a furnace."
task = [{ item = "gtceu:lp_steam_solid_boiler" }]
reward = [{ item = "minecraft:bucket", count = 2 }]
text = """
[num]Five[/] [item]Bronze Plates[/] around a [item]Furnace[/], over [num]two[/] [item]Brick[/] blocks, turned with a wrench. Give it [item]Water[/], burn [item]Coal[/] or [item]Coke[/], and it fills with [item]Steam[/].

[warn]If it runs dry while hot, let it cool before adding water: water poured into a hot, empty boiler makes it explode.[/]
"""

[[quest]]
key = "steam_furnace"
x = 4
y = 2
role = "optional"
deps = ["boiler"]
icon = "gtceu:lp_steam_furnace"
title = "Steam Furnace"
subtitle = "Smelting without fuel."
task = [{ item = "gtceu:lp_steam_furnace" }]
text = """
A furnace that runs on the steam you already make, so your [item]Coal[/] goes to the boiler only.
"""

[[quest]]
key = "pump"
x = 4
y = -2
role = "side"
deps = ["boiler"]
icon = "gtceu:primitive_pump"
title = "Primitive Pump"
subtitle = "Water without buckets."
task = [{ item = "gtceu:primitive_pump" }, { item = "gtceu:pump_hatch" }]
text = """
A boiler drinks a lot. The [item]Primitive Pump[/] draws [item]Water[/] from the world into its [item]Pump Hatch[/]; pipe it to your boilers. It is built from [item]Treated Wood[/], so your Creosote finally has a use.

[note]It does not have to stand in water.[/]
"""

[[quest]]
key = "steam_sources"
x = 4
y = -4
role = "hint"
deps = ["pump"]
icon = "gtceu:lp_steam_solar_boiler"
title = "More Ways to Make Steam"
subtitle = "Pick by the fuel you have."
checkmark = "Understood"
text = """
- [item]Solid Boiler[/]: Coal, Coke, Charcoal. Its Steel version makes more steam.
- [item]Liquid Boiler[/]: burns Creosote and lava. Needs [item]Glass[/].
- [item]Solar Boiler[/]: [tip]no fuel at all[/], [warn]nothing at night[/]. Needs [item]Glass[/].
- [item]Large Bronze Boiler[/]: a multiblock, once you have circuits.

[tip]The Power Generation chapter puts them side by side.[/]
"""

# ------------------------------------------------------------------ the Alloy Smelter and its alloys (below)

[[quest]]
key = "alloy"
x = 6
y = 0
role = "side"
deps = ["boiler"]
icon = "gtceu:lp_steam_alloy_smelter"
title = "Alloy Smelter"
subtitle = "Two inputs, one new metal."
task = [{ item = "gtceu:lp_steam_alloy_smelter" }]
text = """
[num]Two[/] [item]Furnaces[/] and a [item]Bronze Brick Casing[/] in a ring of small bronze pipes. It melts two ingredients into one, and with a [mech]mold[/] it casts glass and rubber.
"""

[[quest]]
key = "red_alloy"
x = 6
y = -2
role = "side"
deps = ["alloy"]
icon = "gtceu:red_alloy_ingot"
title = "Red Alloy"
subtitle = "Copper and redstone."
task = [{ item = "gtceu:red_alloy_ingot", count = 4 }]
text = """
[item]Copper[/] and [num]four[/] [item]Redstone[/] in the Alloy Smelter make [item]Red Alloy[/], the conductor of the Ultra Low Voltage tier.
"""

[[quest]]
key = "red_wire"
x = 6
y = -4
role = "detail"
deps = ["red_alloy"]
icon = "gtceu:red_alloy_single_wire"
title = "Red Alloy Wire"
subtitle = "Plate and wire cutter."
task = [{ item = "gtceu:red_alloy_single_wire", count = 4 }]
text = """
Hammer [item]Red Alloy[/] into a plate and cut it with the [item]Wire Cutter[/]. With rubber, after Steel, it becomes a cable.
"""

[[quest]]
key = "phase_ore"
x = 10
y = -2
role = "side"
deps = ["macerator"]
hide_lines = true
icon = "gtia:raw_phase_matrix"
title = "Phase Matrix"
subtitle = "Infinity Ascension's own ore."
task = [{ item = "gtia:raw_phase_matrix", count = 4 }]
text = """
[item]Phase Matrix[/] deposits sit in the stone of the Overworld between [num]Y 40 and 60[/], marked by indicators on the surface. Your Prospector finds them too.
"""

[[quest]]
key = "phase_dust"
x = 10
y = -4
role = "detail"
deps = ["phase_ore"]
icon = "gtia:impure_phase_matrix_dust"
title = "Impure Phase Dust"
subtitle = "Crushed, then crushed again."
task = [{ item = "gtia:crushed_phase_matrix_ore" }, { item = "gtia:impure_phase_matrix_dust", count = 2 }]
text = """
The [item]Macerator[/] crushes the raw matrix; crush the result again for [item]Impure Phase Matrix Dust[/]. A hand hammer does the second step too.

[note]The recipe viewer shows how much each step yields.[/]
"""

[[quest]]
key = "pulsating"
x = 8
y = -4
role = "side"
deps = ["phase_dust", "alloy"]
icon = "gtia:pulsating_alloy_ingot"
title = "Pulsating Alloy"
subtitle = "Iron plus phase."
task = [{ item = "gtia:pulsating_alloy_ingot", count = 2 }]
text = """
[num]One[/] [item]Iron Ingot[/] and [num]one[/] [item]Impure Phase Matrix Dust[/] in the Alloy Smelter make one [item]Pulsating Alloy[/].

[note]An Ender Pearl in place of the dust works too.[/]
"""

[[quest]]
key = "conductive"
x = 8
y = -6
role = "optional"
deps = ["pulsating", "red_alloy"]
icon = "gtia:conductive_alloy_ingot"
title = "Conductive Alloy"
subtitle = "A wire that loses nothing."
task = [{ item = "gtia:conductive_alloy_ingot", count = 2 }]
text = """
[item]Red Alloy[/] and [item]Pulsating Alloy[/] smelt into [num]two[/] [item]Conductive Alloy[/]. Its wire carries Ultra Low Voltage at [num]4 amps[/] with [tip]no loss over distance[/].
"""

# ------------------------------------------------------------------ the Piston and what it opens

[[quest]]
key = "piston"
x = 8
y = 0
role = "spine"
deps = ["boiler", "alloy"]
icon = "minecraft:piston"
title = "Pistons"
subtitle = "Every steam machine that moves."
task = [{ item = "minecraft:piston", count = 4 }]
text = """
The Compressor takes [num]two[/] [item]Pistons[/], the Macerator [num]two[/], the Forge Hammer [num]one[/]. Iron works; Bronze and Steel are alternatives for the metal in the middle.
"""

[[quest]]
key = "macerator"
x = 10
y = 0
role = "side"
deps = ["piston"]
icon = "gtceu:lp_steam_macerator"
title = "Macerator"
subtitle = "Two diamonds well spent."
task = [{ item = "gtceu:lp_steam_macerator" }]
text = """
[num]Two[/] [item]Pistons[/] and [num]two[/] [item]Diamonds[/]. It grinds ore, bricks, clay and wood into dust without wearing out your mortar, and it is the first step of the [item]Phase Matrix[/].
"""

[[quest]]
key = "grinder"
x = 10
y = 2
role = "side"
deps = ["macerator"]
icon = "gtceu:steam_grinder"
title = "Steam Grinder"
subtitle = "A macerator grown into a multiblock."
task = [{ item = "gtceu:steam_machine_casing", count = 8 }, { item = "gtceu:potin_gear", count = 2 }, { item = "gtceu:steam_grinder" }]
text = """
Your [item]Macerator[/], [num]two[/] [item]Potin Gears[/] and [item]Steam Machine Casings[/] ([num]six[/] Bronze Plates around a Brick make two) form the [item]Steam Grinder[/]. It processes [mech]several items at once[/].

[note]Its preview in the recipe viewer gives the casing count.[/]
"""

[[quest]]
key = "compressor"
deps = ["macerator"]
x = 12
y = 0
role = "spine"
icon = "gtceu:lp_steam_compressor"
title = "Compressor"
subtitle = "Squeeze dust into shape."
task = [{ item = "gtceu:lp_steam_compressor" }]
text = """
[num]Two[/] [item]Pistons[/] and a [item]Bronze Machine Casing[/]. It presses dust into plates, [item]Fireclay[/] into raw bricks and [num]nine[/] [item]Iron Ingots[/] into an [item]Iron Block[/].
"""

[[quest]]
key = "iron_block"
x = 12
y = -2
role = "detail"
deps = ["compressor"]
icon = "minecraft:iron_block"
title = "Iron Blocks"
subtitle = "Only the Compressor makes them."
task = [{ item = "minecraft:iron_block", count = 5 }]
text = """
[warn]Nine ingots on a crafting table do not make an Iron Block in this pack.[/] The Compressor does.
"""

[[quest]]
key = "anvil"
x = 12
y = -4
role = "detail"
deps = ["iron_block"]
icon = "minecraft:anvil"
title = "Anvil"
subtitle = "Five blocks, screws and plates."
task = [{ item = "minecraft:anvil" }]
text = """
[num]Five[/] [item]Iron Blocks[/], [item]Iron Screws[/] and [item]Iron Plates[/]. The Forge Hammer is built around it.
"""

[[quest]]
key = "hammer"
x = 14
y = -4
role = "side"
deps = ["anvil"]
icon = "gtceu:lp_steam_forge_hammer"
title = "Forge Hammer"
subtitle = "Three ingots, two plates."
task = [{ item = "gtceu:lp_steam_forge_hammer" }]
text = """
An [item]Anvil[/] and a [item]Piston[/] in bronze pipes. [num]Three[/] ingots become [num]two[/] plates, where the hand hammer needs two ingots for one. It crushes ore too.
"""

[[quest]]
