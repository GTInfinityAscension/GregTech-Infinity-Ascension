[num]Eight[/] each of [item]Clay Dust[/], [item]Stone Dust[/] (from the Macerator) and [item]Flint Dust[/] in the Brick Kiln make [num]sixteen[/] [item]Clay Compound[/] ingots. Hammer them into plates and gears for hydraulic parts.
