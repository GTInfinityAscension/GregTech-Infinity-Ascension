# The quest book: groups and the order of chapters. Each generated chapter has its own <file>.toml.

[[group]]
key = "start"
title = "Start"

[[group]]
key = "ascensions"
title = "Ascensions"

[[group]]
key = "systems"
title = "Systems"

[[group]]
key = "reference"
title = "Reference"

[[chapter]]
file = "start"
kind = "migrated"      # the author's approved chapter, read from start.original.snbt
group = "start"
order = 0
next = "steam"

[[chapter]]
file = "steam"
kind = "generated"
group = "ascensions"
order = 1
next = "lv"

[[chapter]]
file = "lv"
kind = "generated"
group = "ascensions"
order = 2
next = "mv"

[[chapter]]
file = "mv"
kind = "generated"
group = "ascensions"
order = 3
next = "hv"

[[chapter]]
file = "hv"
kind = "generated"
group = "ascensions"
order = 4

[[chapter]]
file = "energy"
kind = "generated"
group = "systems"
order = 5

[[chapter]]
file = "wireless"
kind = "generated"
group = "systems"
order = 6

[[chapter]]
file = "periodic"
kind = "periodic"      # one quest per element, built from manifest/registry/elements.tsv
group = "reference"
order = 7
