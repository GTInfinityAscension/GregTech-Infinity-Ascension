# The quest book: groups and the order of chapters. Each generated chapter has its own <file>.toml.

[[group]]
key = "start"
title = "Start"

[[group]]
key = "ascensions"
title = "Ascensions"

[[group]]
key = "systems"
title = "Systems"

[[group]]
key = "reference"
title = "Reference"

# layout = "fixed": the x/y written in each quest (the v7 layout, back in D-296 while the GTNH layout is redone).
# layout = "gtnh": positions from quests-src/layout/<file>.toml, the GTNH 2.9 structure of that tier (D-293).
# layout = "layered": positions and line visibility come from tools/quest_layout.py (GTNH-style columns).
# background: the era colour (D-293: Steam bronze, LV grey, MV blue, HV white, EV light purple, IV dark blue).
# texture: textures/quests/backgrounds/<texture>.png, a pixel-art tile drawn behind the chapter in that colour family;
# without it the chapter falls back to era_grid.png tinted with background.
# banner: the era title image (textures/quests/banners/<banner>.png) drawn above the chapter.

[[chapter]]
file = "welcome"
background = "#3B3F46"
texture = "welcome"
kind = "welcome"       # built with the Start: the author's reading quests and the world's mode (D-291)
group = "start"
order = 0

[[chapter]]
file = "start"
background = "#4E4E52"
texture = "start"
kind = "migrated"      # the author's approved chapter, read from start.original.snbt
group = "start"
order = 1
next = "steam"
banner = "start"

[[chapter]]
file = "steam"
layout = "fixed"
background = "#7A5126"
texture = "steam"
kind = "generated"
group = "ascensions"
banner = "steam"
order = 2
next = "lv"

[[chapter]]
file = "lv"
layout = "fixed"
background = "#4C5259"
texture = "lv"
kind = "generated"
group = "ascensions"
banner = "lv"
order = 3
next = "mv"

[[chapter]]
file = "mv"
layout = "fixed"
background = "#1F4C8C"
texture = "mv"
kind = "generated"
group = "ascensions"
banner = "mv"
order = 4
next = "hv"

[[chapter]]
file = "hv"
layout = "fixed"
background = "#C9CFD8"
texture = "hv"
kind = "generated"
group = "ascensions"
banner = "hv"
order = 5

[[chapter]]
file = "agriculture"
background = "#2F5A2C"
texture = "agriculture"
kind = "generated"
group = "systems"
order = 6
layout = "layered"
banner = "agriculture"

[[chapter]]
file = "bees"
background = "#8A6A1C"
texture = "bees"
kind = "generated"
group = "systems"
order = 7
layout = "layered"
banner = "bees"

[[chapter]]
file = "energy"
background = "#5E5220"
texture = "energy"
kind = "generated"
group = "systems"
order = 8

[[chapter]]
file = "wireless"
background = "#1D5E61"
texture = "wireless"
kind = "generated"
