role = "detail"
task = [{ item = "gtia:vanadium_pentoxide_dust" }]
deps = ["mv_chem_reactor"]
x = 4
y = 2.5
group = "acid"
subtitle = "The catalyst."
text = """
Vanadium dust burnt in oxygen. It is never used up.
"""

[[quest]]
key = "contact"
title = "Contact Converter"
role = "side"
task = [{ item = "gtia:contact_converter" }]
deps = ["vanadium_pentoxide"]
x = 4
y = 4.5
group = "acid"
subtitle = "Sulfur into acid, and steam for free."
text = """
Sulfur, oxygen and water over Vanadium Pentoxide: [num]1,000 mB[/] of Sulfuric Acid and [num]2,000 mB[/] of steam per run. The reaction is hot enough to feed your turbines.

[tip]Real fact:[/] sulfuric acid is the most produced chemical in the world; economists once used it to measure how industrial a country was.
"""

[[quest]]
key = "haber"
title = "Ammonia Converter"
role = "side"
task = [{ item = "gtia:ammonia_converter" }]
deps = ["nitrogen"]
x = 2
y = 8.5
group = "acid"
subtitle = "Bread from air."
text = """
Nitrogen and Hydrogen over an iron (Magnetite) catalyst become Ammonia, with a little steam. Your Diaphragm Cell already makes the hydrogen.

[tip]Real fact:[/] the Haber-Bosch process feeds about half of humanity: most of the nitrogen in your body passed through one.
"""

[[quest]]
key = "solvay"
title = "Solvay Tower"
role = "side"
task = [{ item = "gtia:solvay_tower" }]
deps = ["ammonia"]
x = 6
y = 8.5
group = "acid"
subtitle = "Soda from salt and lime."
text = """
Brine, Ammonia and CO₂ give Sodium Bicarbonate and Ammonium Chloride. The Lime Kiln calcines the bicarbonate into Soda Ash, and Quicklime gets the ammonia back.

[tip]Real fact:[/] Ernest Solvay's process (1861) made soda ash so cheap that glass windows became normal houses' business.
"""

[[quest]]
