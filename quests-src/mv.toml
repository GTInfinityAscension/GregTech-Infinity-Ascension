Coke dust bound with Wood Tar in a Mixer. It burns away in the cell, one per run.
"""

[[quest]]
key = "hall_heroult"
title = "Hall-Héroult Cell"
role = "side"
task = [{ item = "gtia:hall_heroult_cell" }]
deps = ["alumina", "cryolite", "anode"]
x = 10
y = 6.5
group = "bayer"
subtitle = "Aluminium the real way."
text = """
[num]2 Alumina[/] and a Carbon Anode become [num]4 Aluminium Ingots[/] and CO₂, with a small chance to use up the cryolite bath. No blast furnace needed.

[tip]Real fact:[/] Charles Hall and Paul Héroult found the same process in 1886, independently, on two continents. Both were 22.
"""

[[quest]]
