"""

[[quest]]
key = "bayer"
title = "Bayer Digester"
role = "side"
task = [{ item = "gtia:bayer_digester" }]
deps = ["mv_chem_reactor"]
x = 8
y = 2.5
group = "bayer"
subtitle = "Bauxite in hot caustic soda."
text = """
Circuit 1 digests [num]1 Bauxite[/], [num]1 Sodium Hydroxide[/], water and steam into [num]1,000 mB[/] of Sodium Aluminate, leaving red mud. Circuit 2 precipitates it into [num]2 Aluminium Hydroxide[/] and gives back most of the soda.

Provisional structure: a hollow [num]3×3×3[/] of Solid Steel Machine Casings with hatches in the walls.

[tip]Real fact:[/] Karl Josef Bayer patented the process in 1888. Nearly all the world's alumina is still made this way.
"""

[[quest]]
key = "alumina"
title = "Alumina"
role = "detail"
task = [{ item = "gtia:alumina_dust", count = 4 }]
deps = ["bayer", "steam:lime_kiln"]
x = 10
y = 2.5
group = "bayer"
hide_lines = true
subtitle = "Calcined in the Lime Kiln."
text = """
Your old Lime Kiln calcines [num]2 Aluminium Hydroxide[/] into [num]1 Alumina[/]. The Steam Age is still working for you.
"""

[[quest]]
key = "cryolite"
title = "Cryolite"
role = "detail"
task = [{ item = "gtia:cryolite_dust" }]
deps = ["bayer", "fluorine", "mv_chem_reactor"]
x = 8
y = 6.5
group = "bayer"
subtitle = "The molten bath."
text = """
Aluminium Hydroxide, Sodium Hydroxide and Hydrofluoric Acid in a Chemical Reactor. Alumina dissolves in it at a much lower temperature.
"""

[[quest]]
key = "anode"
title = "Carbon Anode"
role = "detail"
task = [{ item = "gtia:carbon_anode", count = 4 }]
deps = ["mv_mixer", "steam:charcoal_byproducts"]
x = 12
y = 6.5
group = "bayer"
hide_lines = true
subtitle = "Coke and tar."
