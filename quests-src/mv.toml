text = """
{image:gtia_quests:textures/quests/bayer_digester.png width:62 height:120 align:center}

Circuit 1 digests [num]1 Bauxite[/], [num]1 Sodium Hydroxide[/], water and steam into [num]1,000 mB[/] of Sodium Aluminate, leaving red mud. Circuit 2 precipitates it into [num]2 Aluminium Hydroxide[/] and gives back most of the soda.

Provisional structure: a hollow [num]3×3×3[/] of Solid Steel Machine Casings with hatches in the walls.

[tip]Real fact:[/] Karl Josef Bayer patented the process in 1888. Nearly all the world's alumina is still made this way.
"""

