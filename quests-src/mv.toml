[chapter]
title = "Medium Voltage Age"
icon = "gtceu:mv_machine_hull"

[entry]
x = -0.5
y = 8
reward = [{ item = "gtceu:aluminium_ingot", count = 16 }]
subtitle = "Ascension III"
requires = ["lv:exit", "lv:lv_polarizer", "lv:lv_lathe", "lv:lv_mixer", "lv:lv_electrolyzer", "lv:lv_centrifuge", "lv:lv_chem_reactor", "lv:lv_fluid_heater", "lv:lv_extractor", "lv:lv_solidifier", "lv:blast_furnace", "lv:polyethylene", "lv:hydrochloric_acid", "lv:lv_wiremill", "lv:lv_bender", "lv:lv_assembler", "lv:lv_circuit_assembler"]
text = """
Medium Voltage is where the factory starts to look like an industry: silicon becomes chips, and the old processes of real chemistry plants arrive. Bauxite into aluminium, sulfur into acid, air into ammonia. This Ascension ends with an [item]Advanced Integrated Circuit[/] and an [item]HV Machine Hull[/].
"""

[exit]
x = 19.5
y = 3.75
title = "Ascend to High Voltage"
subtitle = "Stainless steel and a chip that thinks."
deps = ["hv_circuit", "hv_hull"]
text = """
Integrated circuits, stainless steel and Kanthal coils. High Voltage is next.
"""

