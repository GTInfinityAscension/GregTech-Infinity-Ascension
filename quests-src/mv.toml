task = [{ item = "gtceu:soda_ash_dust", count = 8 }]
deps = ["solvay", "steam:lime_kiln"]
x = 8
y = 8.5
group = "acid"
hide_lines = true
subtitle = "Calcined bicarbonate."
text = """
Sodium Bicarbonate from the tower, calcined in your Lime Kiln.
"""

[[quest]]
