# How the approved Start chapter is presented (D-276), split into Welcome and a step-by-step Start in the GTO way
# (D-291). The author's quests keep their ids, text, tasks and rewards; here they get a chapter, a place, a shape and,
# where the road changed, their dependencies. Quests marked new: are written here.
link_x = 16.0
link_y = 7.0

