icon = "minecraft:grass_block"
order = 0
link_to = "new:wood"
link_x = 10.0
link_y = 0.0
titles = [
    "Welcome to Infinity Ascension", "How to Read the Book", "Before You Begin", "About the Pack",
    "Room for a Factory", "Freeze Daylight", "Freeze Weather", "Night Vision",
]

