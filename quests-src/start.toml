# The Steam supplies are per-mode kits (D-291): the author's quest is Journey's, Normal gets a smaller twin.
[[mode_split]]
key = "coke_supply"
title = "Coke for the First Boilers"
normal_subtitle = "A starting stock of boiler fuel."
normal_text = "Claim 16 Coke Blocks to light your first boilers. Keep the Coke Oven running: from here on, fuel is your factory's job."
normal = [{ item = "gtceu:coke_block", count = 16 }]

[[mode_split]]
key = "bronze_supply"
title = "Bronze for the First Machines"
normal_subtitle = "A starting stock of the Steam alloy."
normal_text = "Claim 16 Bronze Ingots for your first steam machine parts, then make your own from Copper and Tin."
normal = [{ item = "gtceu:bronze_ingot", count = 16 }]

[[mode_split]]
key = "tool_supply"
title = "A Tool for the Next Stage"
normal_subtitle = "Equipment for a growing mining operation."
normal_text = "Claim a Steel Mining Hammer: it breaks a 3 x 3 area at once, a good friend for the long tunnels of the Steam Age."
normal = [{ item = "gtceu:steel_mining_hammer" }]
