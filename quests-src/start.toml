[[new_quest]]
key = "research_tree"
role = "side"
after = "Carry and Store More"
x = -3.0
y = 6.0
title = "The Research Tree"
icon = "minecraft:enchanted_book"
subtitle = "Press K to see where you are going."
task = "Open the tree with K"
text = """
Infinity Ascension tracks your progress with a research tree. Press K to open it.

Each node unlocks by itself once its earlier nodes are done and you hold the item it asks for. There is nothing to scan and nothing to submit: crafting, picking up or taking the item from a machine all count, and one member of a team is enough for everyone.

Green nodes are unlocked, yellow ones are the next you can reach, grey ones are locked. A few nodes also lock machine recipes. Those recipes show a red research line in EMI until the node is unlocked.
"""
