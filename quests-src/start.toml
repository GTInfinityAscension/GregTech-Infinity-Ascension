# The two lines that described the old layout, and the kit line that only fit Journey.
[[text_fix]]
title = "How to Read This Chapter"
new_title = "How to Read the Book"
old = "The central column is the main route."
new = "In the Start chapter the road is the main route: it runs right, turns down, runs back left and turns again."

[[text_fix]]
title = "How to Read This Chapter"
old = "The information quests at the top can be read immediately."
new = "The information quests in this chapter can be read right away."

[[text_fix]]
title = "Welcome to Infinity Ascension"
old = "Follow the central path from top to bottom."
new = "In the Start chapter, follow the road from left to right and down."

[[text_fix]]
title = "Welcome to Infinity Ascension"
old = "Check this task and claim your Vanadium Steel Axe, Pickaxe and Shovel. They last about twice as long as Fluix tools and mine everything up to diamond level, so keep them for gathering wood and your first resources."
new = "Check this task and claim your Starting Kit next to it; the tools in it depend on your world's mode."

# ------------------------------------------------------------------ Welcome: new quests and tips

[[new_quest]]
key = "rules"
chapter = "welcome"
role = "hint"
title = "GTIA Rules"
icon = "minecraft:writable_book"
x = 0
y = -5
deps = ["Welcome to Infinity Ascension"]
subtitle = "What your world's mode changes."
text = """
Type [item]/gtia rules[/] to see every rule of this world: recipe speed and cost, steam, maintenance, tools, ore veins, survival and the rest, each with its Journey and Normal value.

The rules are fixed when the world is made. A few of them are read when the game starts, so a new world with other values asks you to restart first.
"""

[[new_quest]]
key = "community"
chapter = "welcome"
role = "hint"
title = "Community and Wiki"
icon = "minecraft:bell"
x = 0
y = 3
deps = ["Welcome to Infinity Ascension"]
subtitle = "Questions, bugs and ideas."
text = """
The pack's Discord is [item]discord.gg/TW5vugknk5[/]: questions, bug reports and playtesting.

The developer docs (GitHub: GTInfinityAscension/GTIA-Dev-Doc) explain the tiers, the systems and every design decision.
"""

[[new_quest]]
key = "go"
chapter = "welcome"
role = "milestone"
title = "Off to Work"
icon = "minecraft:oak_sapling"
x = 7.5
y = 0
deps = ["Room for a Factory"]
subtitle = "The Start chapter is next."
text = """
That is everything you need to know before the first tree. The Start chapter takes you from a log to your first Coke, one step at a time.
"""

[[new_quest]]
key = "emi"
chapter = "welcome"
role = "hint"
title = "Finding Recipes (EMI)"
icon = "minecraft:knowledge_book"
x = -5.5
y = -1
deps = ["How to Read This Chapter"]
subtitle = "R for recipes, U for uses."
text = """
Hover over any item and press [item]R[/] to see how it is made or [item]U[/] to see what it is used in. [item]A[/] adds it to your favourites on the left.

In a recipe, the [item]+[/] button fills the crafting grid from your inventory. On a multiblock controller, the first tab shows the whole structure, layer by layer.
"""

[[new_quest]]
key = "chain"
chapter = "welcome"
role = "hint"
title = "Crafting Chain"
icon = "minecraft:crafting_table"
x = -5.5
y = 1
deps = ["new:emi"]
subtitle = "Every step of a recipe at once."
text = """
Crafting Chain crafts an item [item]and every intermediate step[/] with one key, from what is in your inventory and the chests next to a Crafting Station. When something is missing it says exactly what.

Check its key in Controls; it starts unbound if another mod already uses it.
"""

[[new_quest]]
key = "map"
chapter = "welcome"
role = "hint"
title = "Maps and Claims"
icon = "minecraft:filled_map"
x = 2.5
y = 3
deps = ["Welcome to Infinity Ascension"]
subtitle = "Find your way back."
text = """
The minimap in the corner and the full map ([item]M[/]) are Xaero's. Add a waypoint at your base and at every ore vein you find.

On a server, claim your base with FTB Chunks from the map so nobody breaks it, and force-load the chunks your machines need to keep running.
"""

# ------------------------------------------------------------------ Start: new steps

[[new_quest]]
key = "wood"
role = "milestone"
title = "Punch a Tree"
icon = "minecraft:oak_log"
x = 0
y = 0
deps = ["new:go"]
subtitle = "It is tradition."
task = [{ item = "minecraft:oak_log", count = 16, title = "16 Oak Logs" }]
text = """
Every factory starts with a tree. Sixteen logs give you a workbench, sticks and your first tools, with some left over for a furnace's fuel.

Normal Minecraft tools work fine here; the GregTech ones come a few steps later.
"""

[[new_quest]]
key = "plates"
role = "spine"
title = "Hammer Some Plates"
icon = "gtceu:iron_plate"
x = 7.5
y = 3.5
deps = ["Complete the Tool Kit"]
subtitle = "GregTech builds with plates."
task = [{ item = "gtceu:iron_plate", count = 4, title = "4 Iron Plates" }]
text = """
Two Iron Ingots and your [item]Hammer[/] in the crafting grid make one [item]Iron Plate[/]. GregTech recipes ask for plates, rods and screws where vanilla would ask for ingots; the Coke Oven controller is your first example.

By hand a plate costs two ingots. The Steam Forge Hammer and the Bender make them for less.
"""

[[new_quest]]
key = "clay"
role = "spine"
title = "Clay, Sand and a Mold"
icon = "gtceu:brick_wooden_form"
x = 2.5
y = 7
deps = ["Your First Bronze"]
subtitle = "What Coke Oven bricks are made of."
task = [
    { item = "minecraft:clay_ball", count = 3, title = "3 Clay" },
    { item = "minecraft:sand", count = 5, title = "5 Sand" },
    { item = "gtceu:brick_wooden_form", title = "Wooden Brick Form" },
]
text = """
Clay sits under shallow water and in swamps. The [item]Wooden Brick Form[/] is an Empty Wooden Form shaped with your knife, and it is not used up.

Three clay, five sand and the form make three [item]Compressed Coke Clay[/].
"""

[[new_quest]]
key = "bricks"
role = "spine"
title = "Coke Oven Bricks"
icon = "gtceu:coke_oven_brick"
x = 5
y = 7
deps = ["new:clay"]
subtitle = "Fired in the furnace."
task = [{ item = "gtceu:coke_oven_brick", count = 8, title = "8 Coke Oven Bricks" }]
text = """
Smelt [item]Compressed Coke Clay[/] into [item]Coke Oven Bricks[/]; four of them make one casing block. A Coke Oven takes 25 casings, so keep the furnace busy.
"""

# ------------------------------------------------------------------ Start: tips, next to the step that needs them

[[new_quest]]
key = "tip_ultimine"
role = "hint"
title = "Ultimine"
icon = "minecraft:iron_axe"
x = 0
y = -2.5
deps = ["new:wood"]
subtitle = "A whole tree in one swing."
text = """
Hold the [item]Ultimine[/] key (grave accent by default) while you break a block and every connected block of the same kind breaks too: a whole tree, a whole ore vein.

It breaks up to [num]128[/] blocks in Journey and [num]64[/] in Normal, and each block still costs hunger and tool durability.
"""

[[new_quest]]
key = "tip_veins"
role = "hint"
title = "Ore Veins and the Prospector"
icon = "gtceu:prospector.lv"
x = 2.5
y = -2.5
deps = ["Your First Workbench"]
subtitle = "Ores come in veins, not in specks."
text = """
GregTech ores are placed in large [item]veins[/] of a few related ores, about one vein for every [num]3 x 3[/] chunks. Small ore indicators lie on the surface above a vein.

The [item]Prospector[/] shows the ores under you without digging. Mark every vein you find on the map; you will come back for all of them.
"""

[[new_quest]]
key = "tip_phase"
role = "hint"
title = "Phase Matrix"
icon = "gtia:phase_matrix_ore"
x = 17.5
y = 1.25
deps = ["A Wider Mineral Collection"]
subtitle = "Infinity Ascension's own ore."
text = """
[item]Phase Matrix[/] veins sit between [num]Y 40[/] and [num]Y 60[/]. Crushed twice, the ore gives Impure Phase Dust, which turns iron into [item]Pulsating Alloy[/] and, with Red Alloy, into [item]Conductive Alloy[/], a wire that loses nothing.

You will need it in the Steam chapter.
"""

[[new_quest]]
key = "tip_tools"
role = "hint"
title = "GregTech Tools 101"
icon = "gtceu:iron_wrench"
x = 15
y = 3.5
deps = ["The First GregTech Tools"]
subtitle = "Tools stay in the grid."
text = """
GregTech tools are ingredients: they stay in the crafting grid and lose durability with each use. The [item]Hammer[/] also crushes ores into Crushed Ore, more than one ingot's worth later on.

The [item]Wrench[/] turns and picks up machines, the [item]Screwdriver[/] changes their modes, the [item]Wire Cutter[/] connects cables. In Normal worlds GregTech blocks need the right tool to drop.
"""

[[new_quest]]
key = "tip_fluids"
role = "hint"
title = "Buckets, Cells and Tanks"
icon = "minecraft:bucket"
x = 5
y = 9.75
deps = ["Collect the Creosote"]
subtitle = "Every fluid is counted in mB."
text = """
A bucket holds [num]1,000 mB[/]. GregTech counts every fluid in millibuckets, and machines take them from tanks, cells and pipes, not from your hands.

Creosote burns in a liquid boiler, so keep the oven's output; a Drum or a tank stores it until you need it.
"""

[[new_quest]]
key = "tip_multiblock"
role = "hint"
title = "Your First Multiblock"
icon = "gtceu:coke_oven"
x = 10
y = 9.75
deps = ["Build a Coke Oven"]
subtitle = "Read the structure before you build."
text = """
Press [item]R[/] on a controller: the first EMI tab shows the structure. Scroll through the layers, and the buttons on the right show one layer at a time or the parts that accept hatches.

The [item]GregTech Terminal[/] and the [item]Nexus Structure Terminal[/] can place a structure for you. A controller that does not form tells you what is missing when you hover over it. The [item]Coke Oven Hatch[/] lets pipes take the Coke and Creosote out.
"""

[[new_quest]]
key = "tip_steam"
role = "hint"
title = "Before You Boil"
icon = "gtceu:lp_steam_solid_boiler"
x = 13.5
y = 10
deps = ["Ready for Steam"]
subtitle = "Water first, then fire."
text = """
A boiler heats up slowly and only makes steam once it is hot. Never let it run dry: water poured into an empty, hot boiler makes it [warn]explode[/].

High Pressure boilers are made of steel and give much more steam from the same fuel. The Steam chapter starts with both.
"""

# ------------------------------------------------------------------ modes

[[mode_intro]]
key = "mode"
chapter = "welcome"
x = 0
y = -3
journey_title = "Journey World"
journey_subtitle = "A gentler pace."
journey_icon = "minecraft:totem_of_undying"
journey_text = """
This world is [item]Journey[/]. Same quests, same machines, kinder numbers: recipes are faster and cheaper, boilers give more steam, machines need no maintenance, vanilla recipes are simpler, you keep your inventory on death and radioactive materials do not hurt.

[tip]/gtia rules[/] lists every rule and its value. The mode is fixed when the world is made.
"""
normal_title = "Normal World"
normal_subtitle = "The pack as designed."
normal_icon = "gtceu:steel_pickaxe"
normal_text = """
This world is [item]Normal[/]: the full pack, with the numbers it was balanced for. Maintenance, material hazards, catalyst wear and the organ requirements of other planets are all on.

[tip]/gtia rules[/] lists every rule and its value. The mode is fixed when the world is made.
"""

